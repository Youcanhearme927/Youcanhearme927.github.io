name: fetch-page

on:
  push:
    paths:
      - '.github/workflows/fetch.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download page
        run: curl -fsSL "https://aka.doubaocdn.com/s/isVmZK2gL0" -o index.html
      - name: Commit page
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "add page" || echo "no change"
          git push
